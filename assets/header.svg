<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; }
      .titlebox { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 700 28px 'Courier New', monospace; fill: #0f766e; }
      .mini { font: 700 18px 'Courier New', monospace; fill: #0f766e; }
      .num { font: 700 22px 'Courier New', monospace; fill: #0f766e; }
      .coin { font: 700 24px Arial, sans-serif; fill: #16a34a; }
      .axis { stroke: #94a3b8; stroke-width: 3; }
      .chart { stroke: #0f766e; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #0f766e; }
      .glass { stroke: #0f172a; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <!-- background -->
  <rect x="8" y="8" width="984" height="304" rx="14" class="bg"/>

  <!-- title box -->
  <rect x="40" y="32" width="920" height="64" rx="8" class="titlebox"/>

  <!-- title -->
  <text x="500" y="73" text-anchor="middle" class="title">Hi 👋, I'm Tran Thi Phuong Uyen</text>

  <!-- money rain only at first part -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.27;1" dur="12s" repeatCount="indefinite"/>

    <g>
      <text x="150" y="18" class="coin">$</text>
      <animateTransform attributeName="transform" type="translate" values="0,-8;0,88" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.7s" repeatCount="indefinite"/>
    </g>

    <g>
      <text x="280" y="12" class="coin">$</text>
      <animateTransform attributeName="transform" type="translate" values="0,-10;0,90" dur="1.9s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.9s" begin="0.2s" repeatCount="indefinite"/>
    </g>

    <g>
      <text x="420" y="15" class="coin">$</text>
      <animateTransform attributeName="transform" type="translate" values="0,-10;0,86" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </g>

    <g>
      <text x="610" y="10" class="coin">$</text>
      <animateTransform attributeName="transform" type="translate" values="0,-10;0,92" dur="1.8s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="0.1s" repeatCount="indefinite"/>
    </g>

    <g>
      <text x="760" y="14" class="coin">$</text>
      <animateTransform attributeName="transform" type="translate" values="0,-12;0,90" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
    </g>

    <g>
      <text x="860" y="12" class="coin">$</text>
      <animateTransform attributeName="transform" type="translate" values="0,-10;0,95" dur="1.85s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.85s" begin="0.3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- scene 1: data analyst -->
  <g opacity="0">
    <text x="500" y="150" text-anchor="middle" class="sub">Data Analyst</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.28;0.32;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- scene 2: magnifier + jumping numbers -->
  <g opacity="0">
    <text x="500" y="145" text-anchor="middle" class="mini">Searching insights...</text>

    <g>
      <circle cx="210" cy="140" r="18" class="glass"/>
      <line x1="224" y1="154" x2="242" y2="172" class="glass" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;560,0" begin="4.0s" dur="2.2s" repeatCount="indefinite"/>
    </g>

    <text x="230" y="210" class="num">
      124
      <animate attributeName="opacity" values="0;1;0.4;1;0" begin="4.1s" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;195;210;190;210" begin="4.1s" dur="1.7s" repeatCount="indefinite"/>
    </text>

    <text x="350" y="225" class="num">
      +52
      <animate attributeName="opacity" values="0;1;0.5;1;0" begin="4.25s" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="225;210;225;206;225" begin="4.25s" dur="1.6s" repeatCount="indefinite"/>
    </text>

    <text x="470" y="205" class="num">
      87%
      <animate attributeName="opacity" values="0;1;0.3;1;0" begin="4.0s" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="205;190;205;188;205" begin="4.0s" dur="1.9s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="225" class="num">
      999
      <animate attributeName="opacity" values="0;1;0.4;1;0" begin="4.2s" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="225;208;225;205;225" begin="4.2s" dur="1.8s" repeatCount="indefinite"/>
    </text>

    <text x="720" y="205" class="num">
      3.14
      <animate attributeName="opacity" values="0;1;0.4;1;0" begin="4.3s" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="205;190;205;188;205" begin="4.3s" dur="1.7s" repeatCount="indefinite"/>
    </text>

    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.34;0.54;0.58;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- scene 3: growth chart -->
  <g opacity="0">
    <text x="500" y="145" text-anchor="middle" class="mini">Growth in progress...</text>

    <line x1="250" y1="235" x2="760" y2="235" class="axis"/>
    <line x1="250" y1="235" x2="250" y2="165" class="axis"/>

    <path d="M270 220 L360 210 L450 194 L540 180 L635 150 L730 118"
          class="chart"
          stroke-dasharray="600"
          stroke-dashoffset="600">
      <animate attributeName="stroke-dashoffset" values="600;0;0" begin="7.0s" dur="1.9s" repeatCount="indefinite"/>
    </path>

    <circle cx="270" cy="220" r="0" class="dot">
      <animate attributeName="r" values="0;4;4" begin="7.0s" dur="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="210" r="0" class="dot">
      <animate attributeName="r" values="0;0;4;4" begin="7.2s" dur="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="194" r="0" class="dot">
      <animate attributeName="r" values="0;0;4;4" begin="7.4s" dur="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="180" r="0" class="dot">
      <animate attributeName="r" values="0;0;4;4" begin="7.6s" dur="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="635" cy="150" r="0" class="dot">
      <animate attributeName="r" values="0;0;4;4" begin="7.8s" dur="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="118" r="0" class="dot">
      <animate attributeName="r" values="0;0;5;5" begin="8.0s" dur="0.35s" repeatCount="indefinite"/>
    </circle>

    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.57;0.60;0.78;0.82;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- scene 4: final data analyst -->
  <g opacity="0">
    <text x="500" y="150" text-anchor="middle" class="sub">Data Analyst</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.81;0.84;0.98;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <line x1="40" y1="298" x2="960" y2="298" stroke="#cbd5e1" stroke-width="4"/>
</svg>
